[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spitfire-external-control"
version = "2.0.0"
description = "Empower-independent Spitfire controller with confirmed PC1/PC2 sequencing"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
qt = ["PySide6>=6.6,<7"]
test = ["pytest>=8"]
analysis = ["pefile>=2023.2.7", "unicorn>=2.1,<3", "capstone>=5,<6"]

[project.scripts]
spitfire = "spitfire.__main__:main"
spitfire-external = "spitfire.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spitfire*"]

[tool.setuptools.package-data]
spitfire = ["resources/*", "resources/runtime/*", "resources/assets/*", "resources/sprites/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
