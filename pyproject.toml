[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spitfire-gui-reconstruction"
version = "1.6.0.post2"
description = "Evidence-based Python reconstruction of the uploaded Spitfire GUI 1.6.0"
requires-python = ">=3.10"

[project.optional-dependencies]
qt = ["PySide6>=6.6,<7"]
test = ["pytest>=8"]
analysis = ["pefile>=2023.2.7", "unicorn>=2.1,<3", "capstone>=5,<6"]

[project.scripts]
spitfire = "spitfire.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spitfire*"]

[tool.setuptools.package-data]
spitfire = ["resources/*", "resources/runtime/*", "resources/runtime/bin/*",
            "resources/runtime/fonts/*", "resources/assets/*", "resources/sprites/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
