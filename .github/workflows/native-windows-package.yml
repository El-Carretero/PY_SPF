name: Native Windows x86 package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "spitfire/**"
      - "packaging/windows/**"
      - "requirements-build.txt"
      - ".github/workflows/native-windows-package.yml"
  pull_request:
    paths:
      - "spitfire/**"
      - "packaging/windows/**"
      - "requirements-build.txt"
      - ".github/workflows/native-windows-package.yml"

permissions:
  contents: read

jobs:
  native-x86:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          architecture: x86
      - name: Build private onedir bundle and audit x86 dependencies
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "The runner needs Inno Setup 6.4+; no tool is installed globally by this job." }
          ./packaging/windows/build.ps1 -Python python -InnoCompilerPath $compiler
      - name: Check frozen CLI with simulator only
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "packaging/windows/dist/PY_SPF/PY_SPF.exe"
          $child = Start-Process -FilePath $exe -ArgumentList @("--demo", "--headless", "--duration", "0.5", "--tcp-port", "0", "--local-port", "0") -PassThru
          if (-not $child.WaitForExit(30000)) {
            $child.Kill()
            throw "Frozen simulator CLI did not exit within 30 seconds."
          }
          if ($child.ExitCode -ne 0) { throw "Frozen simulator CLI exited $($child.ExitCode)." }
      - name: Check packaged NI GUI using simulator only
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "packaging/windows/dist/PY_SPF/PY_SPF.exe"
          $report = Join-Path $PWD "packaging/windows/dist/native-self-test.json"
          $snapshot = Join-Path $PWD "packaging/windows/dist/native-self-test.bmp"
          $child = Start-Process -FilePath $exe -ArgumentList @("--self-test-native", "--output", ('"' + $report + '"'), "--snapshot", ('"' + $snapshot + '"'), "--duration", "20") -PassThru
          if (-not $child.WaitForExit(45000)) {
            $child.Kill()
            throw "Packaged NI simulator check did not exit within 45 seconds."
          }
          if ($child.ExitCode -ne 0) { throw "Packaged NI simulator check exited $($child.ExitCode)." }
          if (-not (Test-Path -LiteralPath $report)) { throw "Packaged NI check did not write its report." }
      - name: Install, test in Unicode path, uninstall and compare isolation state
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "packaging/windows/dist/installer/PY_SPF_1.2_Setup_x86.exe"
          $reports = Join-Path $PWD "packaging/windows/dist/install-validation"
          $nonLatin = [string]::Concat([char]0xAC80, [char]0xC99D)
          $microscope = [char]::ConvertFromUtf32(0x1F52C)
          $install = Join-Path $env:RUNNER_TEMP ("PY_SPF_" + $nonLatin + "_" + $microscope)
          if ([Text.Encoding]::UTF8.GetByteCount((Join-Path $install "PY_SPF.exe")) -ge 259) {
            throw "The test path exceeds the original CVI UTF-8 path limit."
          }
          & ./packaging/windows/test_install.ps1 -SetupPath $setup -OutputDirectory $reports -InstallDirectory $install
          if ($LASTEXITCODE -ne 0) { throw "Install/run/uninstall isolation check failed." }
          $result = Get-Content -LiteralPath (Join-Path $reports "install-validation.json") -Raw | ConvertFrom-Json
          if ($result.passed -ne $true) { throw "Install validation did not report passed=true." }
      - name: Archive app-local bundle
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath packaging/windows/dist/PY_SPF -DestinationPath packaging/windows/dist/PY_SPF_1.2_win32_portable.zip
      - name: Record exact tested artifact hashes
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "packaging/windows/dist"
          $paths = @(
            "installer/PY_SPF_1.2_Setup_x86.exe",
            "PY_SPF_1.2_win32_portable.zip",
            "PY_SPF/bundle-manifest.json",
            "native-self-test.json",
            "native-self-test.bmp",
            "install-validation/install-validation.json",
            "install-validation/native-self-test.json",
            "install-validation/native-self-test.bmp",
            "install-validation/native-self-test_timing_user.bmp",
            "install-validation/native-self-test_timing_service.bmp",
            "install-validation/native-self-test_external_rate.bmp"
          )
          $records = foreach ($relative in $paths) {
            $file = Join-Path $dist $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing tested artifact: $relative" }
            @{ path = $relative; bytes = (Get-Item -LiteralPath $file).Length; sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ schema = 1; source_commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; files = @($records) } |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $dist "tested-artifacts.json") -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PY_SPF-1.2-native-win32
          path: |
            packaging/windows/dist/PY_SPF_1.2_win32_portable.zip
            packaging/windows/dist/PY_SPF/bundle-manifest.json
            packaging/windows/dist/installer/PY_SPF_1.2_Setup_x86.exe
            packaging/windows/dist/native-self-test.json
            packaging/windows/dist/native-self-test.bmp
            packaging/windows/dist/install-validation/install-validation.json
            packaging/windows/dist/install-validation/native-self-test.json
            packaging/windows/dist/install-validation/native-self-test.bmp
            packaging/windows/dist/install-validation/native-self-test_timing_user.bmp
            packaging/windows/dist/install-validation/native-self-test_timing_service.bmp
            packaging/windows/dist/install-validation/native-self-test_external_rate.bmp
            packaging/windows/dist/tested-artifacts.json
          if-no-files-found: error

  publish-tested-binaries:
    needs: native-x86
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TESTED_SHA: ${{ github.sha }}
      TESTED_RUN_ID: ${{ github.run_id }}
      TARGET_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: PY_SPF-1.2-native-win32
          path: tested-native-artifact
      - name: Verify tested payload and publish only to the unchanged source branch
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          if [ "$remote_head" != "$TESTED_SHA" ]; then
            echo "Source branch has advanced; skip publishing stale test artifacts."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil

          artifact = Path("tested-native-artifact")
          manifest = json.loads((artifact / "tested-artifacts.json").read_text(encoding="utf-8-sig"))
          if manifest.get("source_commit") != os.environ["TESTED_SHA"] or str(manifest.get("run_id")) != os.environ["TESTED_RUN_ID"]:
              raise SystemExit("Artifact source/run identity does not match this successful workflow")
          names = {
              "installer/PY_SPF_1.2_Setup_x86.exe": "PY_SPF_1.2_Setup_x86.exe",
              "PY_SPF_1.2_win32_portable.zip": "PY_SPF_1.2_win32_portable.zip",
              "PY_SPF/bundle-manifest.json": "bundle-manifest.json",
              "native-self-test.json": "native-self-test.json",
              "native-self-test.bmp": "native-self-test.bmp",
              "install-validation/install-validation.json": "install-validation.json",
              "install-validation/native-self-test.json": "installed-native-self-test.json",
              "install-validation/native-self-test.bmp": "installed-native-self-test.bmp",
              "install-validation/native-self-test_timing_user.bmp": "installed-timing-user.bmp",
              "install-validation/native-self-test_timing_service.bmp": "installed-timing-service.bmp",
              "install-validation/native-self-test_external_rate.bmp": "installed-external-rate.bmp",
          }
          entries = manifest.get("files", [])
          if len(entries) != len(names) or {row["path"] for row in entries} != set(names):
              raise SystemExit("Test artifact allowlist differs from the required payload")
          for row in entries:
              source = artifact / row["path"]
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"Missing or unexpected artifact: {row['path']}")
              data = source.read_bytes()
              if len(data) != row["bytes"] or hashlib.sha256(data).hexdigest() != row["sha256"]:
                  raise SystemExit(f"Test artifact hash differs: {row['path']}")
              if len(data) >= 95 * 1024 * 1024:
                  raise SystemExit(f"Artifact exceeds the repository binary size budget: {row['path']}")
          proof = json.loads((artifact / "install-validation/install-validation.json").read_text(encoding="utf-8-sig"))
          if proof.get("passed") is not True:
              raise SystemExit("Install/run/uninstall proof is not a passing result")
          checks = {row.get("name"): row.get("passed") for row in proof.get("checks", [])}
          for required in ("regular-native-demo-graceful-exit", "uninstalled-payload-files-removed", "native-hv-visible-layout", "native-timing-user-bmp-written", "native-timing-service-bmp-written", "native-external-shared-rate", "native-external-rate-bmp-written"):
              if checks.get(required) is not True:
                  raise SystemExit(f"Required installation proof is missing or failed: {required}")
          destination = Path("output/native-installer")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)
          for source, target in names.items():
              shutil.copyfile(artifact / source, destination / target)
          shutil.copyfile(artifact / "tested-artifacts.json", destination / "tested-artifacts.json")
          repo_url = os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TESTED_SHA"]
          run_url = repo_url + "/actions/runs/" + os.environ["TESTED_RUN_ID"]
          (destination / "README.md").write_text(
              "# Tested Native PY_SPF 1.2 Windows x86 package\n\n"
              + f"Source: [{sha}]({repo_url}/tree/{sha}).\n\n"
              + f"Build and validation: [workflow run]({run_url}).\n\n"
              + "- [Installer](PY_SPF_1.2_Setup_x86.exe)\n"
              + "- [Portable onedir ZIP](PY_SPF_1.2_win32_portable.zip)\n"
              + "- [Bundle file/dependency manifest](bundle-manifest.json)\n"
              + "- [Install/run/uninstall and isolation report](install-validation.json)\n"
              + "- [Installed NI simulator report](installed-native-self-test.json)\n"
              + "- [Installed NI snapshot](installed-native-self-test.bmp)\n"
              + "- [Timing panel: User](installed-timing-user.bmp)\n"
              + "- [Timing panel: Service](installed-timing-service.bmp)\n"
              + "- [EXT shared rate: 10 Hz](installed-external-rate.bmp)\n"
              + "- [SHA256 checksums](SHA256SUMS)\n\n"
              + "Validation uses the simulator, including an installation path with Korean characters and an emoji. "
              + "It does not establish equipment actuation, optical output or human engineering approval. "
              + "See the source installation notes and retained JSON for the exact scope.\n",
              encoding="utf-8",
          )
          sums = "".join(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n" for path in sorted(destination.iterdir()) if path.is_file())
          (destination / "SHA256SUMS").write_text(sums, encoding="ascii")
          PY
          remote_head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          if [ "$remote_head" != "$TESTED_SHA" ]; then
            echo "Source branch advanced while verifying artifacts; skip stale publication."
            exit 0
          fi
          git checkout -B "$TARGET_BRANCH" "$TESTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output/native-installer
          if git diff --cached --quiet; then
            echo "The tested outputs are already recorded."
            exit 0
          fi
          git commit -m "build: publish tested Native 1.2 installer ($TESTED_SHA)"
          # Validate the old object advertised by receive-pack as well as the
          # earlier reads. Normal server old-object checks then close the race
          # without force-pushing, including a concurrent branch rewind.
          publish_hooks=$(mktemp -d "$RUNNER_TEMP/spf-publish-hooks.XXXXXX")
          trap 'rm -rf "$publish_hooks"' EXIT
          cat > "$publish_hooks/pre-push" <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail
          while read -r local_ref local_object remote_ref remote_object; do
            if [ "$remote_ref" != "refs/heads/$TARGET_BRANCH" ] || [ "$remote_object" != "$TESTED_SHA" ]; then
              echo "Refuse to publish over a changed source branch." >&2
              exit 1
            fi
          done
          HOOK
          chmod +x "$publish_hooks/pre-push"
          if ! git -c core.hooksPath="$publish_hooks" push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
            remote_head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)
            if [ "$remote_head" != "$TESTED_SHA" ]; then
              echo "Source branch advanced before push; stale outputs were not published."
              exit 0
            fi
            exit 1
          fi
