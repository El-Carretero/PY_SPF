[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spitfire-control"
version = "1.3.0"
description = "Clean-room Python control and diagnostic GUI for Spectra-Physics Spitfire/Empower systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Spitfire Python Control contributors"}]
dependencies = ["pyserial>=3.5"]

[project.scripts]
spitfire-control = "spitfire_control.app:main"
spitfire-validate = "spitfire_control.validation:main"

[tool.setuptools.packages.find]
where = ["src"]
