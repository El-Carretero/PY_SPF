[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spitfire-twin-verifier"
version = "0.3.0"
description = "Virtual Spitfire device and wire-level differential verifier"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JaeHyeong Yu / XLAPPLAS interoperability project"}]
dependencies = []

[project.scripts]
spitfire-twin-verifier = "spitfire_twin_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spitfire_twin_verifier = ["data/**/*.json"]
